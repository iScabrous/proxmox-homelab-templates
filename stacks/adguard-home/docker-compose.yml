services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    ports:
      # Plain DNS (bind to 0.0.0.0 or your LAN IP)
      - "53:53/tcp"
      - "53:53/udp"
      # Initial setup wizard (loopback only to prevent unauthenticated takeover)
      - "127.0.0.1:3000:3000/tcp"
      # Web UI & Admin interface
      - "127.0.0.1:8083:80/tcp"
      # Optional: DNS-over-HTTPS (uncomment if exposing DoH and no port 443 conflict)
      # - "443:443/tcp"
      # Optional: DNS-over-TLS (uncomment if exposing DoT)
      # - "853:853/tcp"
    networks:
      - adguard_net

networks:
  adguard_net:
    driver: bridge
